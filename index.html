<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2026跨年惊喜（弹幕+图片+音乐版）</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            min-height: 100vh;
            background: url("pic1.jpg") no-repeat center center;
            background-size: cover;
            background-attachment: fixed;
            overflow: hidden;
            position: relative;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        }
        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.4);
            z-index: 5;
            pointer-events: none;
        }
        /* 音乐控制按钮 */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ff69b4;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 25;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .gift-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: clamp(280px, 80vw, 400px);
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            z-index: 20;
            overflow: hidden;
            display: block;
        }
        .gift-modal-header {
            padding: 12px;
            background: #ff69b4;
            color: #fff;
            text-align: center;
            font-size: clamp(16px, 4vw, 20px);
        }
        .gift-modal-body {
            padding: clamp(20px, 5vw, 30px);
            font-size: clamp(14px, 3.5vw, 18px);
            color: #333;
            text-align: center;
        }
        .gift-modal-btn {
            width: 100%;
            padding: clamp(12px, 3vw, 16px);
            background: #ff69b4;
            color: #fff;
            border: none;
            font-size: clamp(16px, 4vw, 20px);
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .gift-modal-btn:hover {
            background: #ff4785;
        }
        .barrage {
            position: absolute;
            padding: clamp(5px, 2vw, 8px) clamp(8px, 2.5vw, 12px);
            border-radius: clamp(18px, 4vw, 22px);
            font-size: clamp(10px, 2.8vw, 13px);
            line-height: 1.3;
            white-space: nowrap;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
            opacity: 0;
            z-index: 10;
            transform: rotate(0deg) scale(0.7);
            backdrop-filter: blur(1px);
            transition: 
                opacity 0.8s ease-out, 
                transform 0.8s ease-out,
                left 0.5s linear,
                top 0.5s linear;
        }
        .barrage::before {
            content: "❤️";
            margin-right: clamp(3px, 0.8vw, 6px);
            font-size: clamp(9px, 2.5vw, 12px);
        }
        .barrage.light-blue { background: linear-gradient(90deg, #e0f7ff, #b2ebf2); border: 1px solid #80deea; }
        .barrage.light-pink { background: linear-gradient(90deg, #ffebee, #ffcdd2); border: 1px solid #ef9a9a; }
        .barrage.light-yellow { background: linear-gradient(90deg, #fff8e1, #ffe0b2); border: 1px solid #ffcc80; }
        .barrage.light-purple { background: linear-gradient(90deg, #f3e5f5, #e1bee7); border: 1px solid #ce93d8; }
        .img-barrage {
            position: absolute;
            width: clamp(40px, 8vw, 80px);
            height: auto;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.3);
            opacity: 0;
            z-index: 10;
            transform: rotate(0deg) scale(0.7);
            transition: 
                opacity 0.8s ease-out, 
                transform 0.8s ease-out,
                left 0.5s linear,
                top 0.5s linear;
            object-fit: cover;
        }
        .active {
            opacity: 0.95;
            transform: rotate(calc(var(--rotate) * 0.8deg)) scale(1);
        }
        .fade-out {
            opacity: 0.3;
            transform: rotate(calc(var(--rotate) * 0.8deg)) scale(0.9);
        }
        .replace {
            opacity: 0.95;
            transform: rotate(calc(var(--rotate) * 0.8deg)) scale(1);
        }
    </style>
</head>
<body>
    <!-- 音乐控制按钮 -->
    <div class="music-control" id="musicBtn">🎵</div>
    <!-- 背景音乐（替换为你的MP3文件路径） -->
    <audio id="bgMusic" loop>
        <source src="指纹.mp3" type="audio/mpeg">
        您的浏览器不支持音频播放
    </audio>
    <div class="gift-modal" id="giftModal">
        <div class="gift-modal-header">❤️</div>
        <div class="gift-modal-body">凌老师遇见你是我最大的幸运</div>
        <button class="gift-modal-btn" id="openGiftBtn">GO！</button>
    </div>
    <div id="barrageContainer"></div>

    <script>
        const texts = [
            "明年要比今年更更更更更更好",
            "你好2026",
            "一起跨年",
            "所有美好也如期而至",
            "Happy Year新年快乐",
            "烟火起 照人间",
            "祝我们，好在新的一年！",
            "是新的一年，是新的开始",
            "去年的遗憾，一定是今年惊喜的铺垫",
            "新的一年奔赴所期·所爱",
            "新年和你一起跨年","新的一年，解锁更多美好",
    "愿你所欲皆如愿，所行皆坦途",
    "跨年快乐，岁岁无忧",
    "和喜欢的一切，撞个满怀",
    "新年，要更爱自己呀",
    "烟火气里，岁岁长安",
    "2026，一路生花，万事顺意",
    "告别过往，奔赴新程",
    "愿日子滚烫，人间可爱",
    "新岁，有趣有盼，无灾无难",
    "跨过分秒，相伴年年",
    "2026，保持热爱，奔赴山海",
    "愿我们，都闪闪发光",
    "新年，平安喜乐，万事胜意",
    "岁月如新，美好常在",
    // 新增浪漫向文案开始
    "2026，和你一起看遍人间烟火",
    "跨年的意义，是身边有你",
    "往后余生，岁岁年年都是你",
    "新岁伊始，爱意不减",
    "把温柔和浪漫，留给2026和你",
    "陪你跨年，陪你岁岁年年",
    "2026，继续甜度超标",
    "你是新年最好的礼物",
    "烟火下告白，岁月里相爱",
    "愿我们，年年皆胜意，岁岁皆相爱",
    "新的一年，满眼都是你",
    "跨年夜的星光，不及你眉眼温柔",
    "2026，与你共赴白头之约",
    "爱你，从旧年到新年，从心动到白首",
    "新年的第一句情话，说给你听",
    "和你一起，就是最浪漫的跨年",
    "2026，让爱延续，温柔以待",
    "你在身边，年年皆胜意",
    "跨过分秒，爱你朝朝暮暮",
    "浪漫不死，爱意年年",
    "2026，把所有偏爱都给你",
    "与你相守，岁岁长安，年年有爱",
    "新年的第一束光，和你一起见证",
    "往后的每一个跨年，都想有你",
    "2026，爱意东升西落，浪漫至死不渝",
    "陪你走过冬夏，跨过新年，爱你不止",
    "你是藏在跨年烟火里的浪漫",
    "新岁，爱你如初，深情不负",
    "和你一起倒数，迎接满是爱的2026",
    "浪漫跨年，余生有你，足矣",
            "会充满惊喜"
        ];
        const colors = ["light-blue", "light-pink", "light-yellow", "light-purple"];
        const customImages = [
            "pic1.jpg",
            "2.jpg",
           "3.jpg", "4.jpg", "5.jpg", "6.jpg", "7.jpg", "8.jpg", "9.jpg", "10.jpg", "11.jpg", "12.jpg",
"13.jpg", "14.jpg", "15.jpg", "16.jpg", "17.jpg", "18.jpg", "19.jpg", "20.jpg", "21.jpg", "22.jpg", "23.jpg"
        ];
        let allElements = [];
        let elementTypeMap = new Map();
        // 音乐相关变量
        const bgMusic = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");
        let isMusicPlaying = false;

        // -------------------------- 可调参数区 --------------------------
        const maxTotalCount = 150;   // 总元素数量
        const imgRatio = 0.3;        // 图片占比（30%）
        const appearInterval = 200;  // 出现间隔（毫秒）
        const replaceCycle = 2500;   // 覆盖周期（毫秒）
        const replaceRatio = 0.12;   // 每次替换比例
        const rotateRange = 6;       // 旋转角度范围
        const opacityActive = 0.95;  // 激活透明度
        const opacityFadeOut = 0.3;  // 淡出透明度
        // ----------------------------------------------------------------

        // 音乐控制逻辑
        function initMusic() {
            // 开启音乐自动预加载（已添加，解决加载慢问题）
            bgMusic.preload = "auto";
            // 点击按钮控制播放/暂停
            musicBtn.addEventListener("click", () => {
                if (isMusicPlaying) {
                    bgMusic.pause();
                    musicBtn.textContent = "🔇";
                } else {
                    bgMusic.play().then(() => {
                        musicBtn.textContent = "🎵";
                    }).catch(err => {
                        alert("请点击允许浏览器播放音频~");
                    });
                }
                isMusicPlaying = !isMusicPlaying;
            });

            // 弹窗点击时尝试自动播放（兼容浏览器策略）
            document.getElementById("openGiftBtn").addEventListener("click", () => {
                if (!isMusicPlaying) {
                    bgMusic.muted = true;
                    bgMusic.play().then(() => {
                        bgMusic.muted = false;
                        isMusicPlaying = true;
                        musicBtn.textContent = "🎵";
                    }).catch(err => {});
                }
            });
        }

        // 生成混合元素
        function createMixedElements() {
            const container = document.getElementById("barrageContainer");
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;
            const imgCount = Math.floor(maxTotalCount * imgRatio);
            const barrageCount = maxTotalCount - imgCount;

            for (let i = 0; i < barrageCount; i++) {
                const element = createBarrage();
                const [left, top] = getRandomPosition(windowWidth, windowHeight, "barrage");
                element.style.left = `${left}px`;
                element.style.top = `${top}px`;
                container.appendChild(element);
                allElements.push(element);
                elementTypeMap.set(element, "barrage");
            }

            for (let i = 0; i < imgCount; i++) {
                const element = createImgElement();
                const [left, top] = getRandomPosition(windowWidth, windowHeight, "img");
                element.style.left = `${left}px`;
                element.style.top = `${top}px`;
                container.appendChild(element);
                allElements.push(element);
                elementTypeMap.set(element, "img");
            }
        }

        function createBarrage() {
            const barrage = document.createElement("div");
            barrage.className = `barrage ${colors[Math.floor(Math.random() * colors.length)]}`;
            barrage.textContent = texts[Math.floor(Math.random() * texts.length)];
            const rotateAngle = (Math.random() - 0.5) * rotateRange;
            barrage.style.setProperty("--rotate", rotateAngle);
            return barrage;
        }

        function createImgElement() {
            const img = document.createElement("img");
            img.className = "img-barrage";
            const randomImgUrl = customImages[Math.floor(Math.random() * customImages.length)];
            img.src = randomImgUrl;
            img.alt = "自定义图片";
            const rotateAngle = (Math.random() - 0.5) * rotateRange;
            img.style.setProperty("--rotate", rotateAngle);
            img.onerror = () => {
                img.style.backgroundColor = "#ff69b4";
                img.style.display = "flex";
                img.style.alignItems = "center";
                img.style.justifyContent = "center";
                const heart = document.createElement("span");
                heart.style.color = "#fff";
                heart.style.fontSize = "12px";
                heart.textContent = "❤️";
                img.appendChild(heart);
            };
            return img;
        }

        function getRandomPosition(windowWidth, windowHeight, type) {
            const padding = 20;
            let maxLeft, maxTop;
            if (type === "barrage") {
                maxLeft = windowWidth - 120;
                maxTop = windowHeight - 60;
            } else {
                maxLeft = windowWidth - 100;
                maxTop = windowHeight - 100;
            }
            const left = Math.random() * (maxLeft - padding) + padding;
            const top = Math.random() * (maxTop - padding) + padding;
            return [left, top];
        }

        function gradualAppearMixedElements() {
            const shuffledElements = [...allElements].sort(() => Math.random() - 0.5);
            shuffledElements.forEach((element, index) => {
                setTimeout(() => {
                    element.classList.add("active");
                    element.style.opacity = opacityActive;
                }, index * appearInterval);
            });
            setTimeout(() => {
                startMixedReplaceCycle();
            }, shuffledElements.length * appearInterval + 800);
        }

        function startMixedReplaceCycle() {
            setInterval(() => {
                const container = document.getElementById("barrageContainer");
                const windowWidth = window.innerWidth;
                const windowHeight = window.innerHeight;
                const replaceCount = Math.floor(allElements.length * replaceRatio);
                const replaceIndexes = Array.from({ length: replaceCount }, () => 
                    Math.floor(Math.random() * allElements.length)
                );

                replaceIndexes.forEach(index => {
                    const oldElement = allElements[index];
                    const oldType = elementTypeMap.get(oldElement);

                    oldElement.classList.remove("active", "replace");
                    oldElement.classList.add("fade-out");
                    oldElement.style.opacity = opacityFadeOut;

                    let newElement = oldType === "barrage" ? createBarrage() : createImgElement();
                    const [newLeft, newTop] = getRandomPosition(windowWidth, windowHeight, oldType);
                    newElement.style.left = `${newLeft}px`;
                    newElement.style.top = `${newTop}px`;
                    container.appendChild(newElement);

                    setTimeout(() => {
                        newElement.classList.add("replace");
                        newElement.style.opacity = opacityActive;
                        setTimeout(() => {
                            container.removeChild(oldElement);
                        }, 600);
                    }, 300);

                    allElements[index] = newElement;
                    elementTypeMap.set(newElement, oldType);
                    elementTypeMap.delete(oldElement);
                });
            }, replaceCycle);
        }

        // 弹窗点击逻辑
        document.getElementById("openGiftBtn").addEventListener("click", function() {
            const modal = document.getElementById("giftModal");
            modal.style.opacity = 0;
            modal.style.transform = "translate(-50%, -50%) scale(0.9)";
            modal.style.transition = "all 0.5s ease-out";
            setTimeout(() => {
                modal.style.display = "none";
                gradualAppearMixedElements();
            }, 500);
        });

        // 初始化
        window.onload = function() {
            initMusic(); // 初始化音乐
            createMixedElements();
        };

        window.addEventListener("resize", () => {
            const container = document.getElementById("barrageContainer");
            container.innerHTML = "";
            allElements = [];
            elementTypeMap.clear();
            createMixedElements();
        });
    </script>
</body>
</html>
